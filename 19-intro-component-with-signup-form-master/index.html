<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./images/favicon-32x32.png"
    />
    <link rel="stylesheet" href="styles/style.css">

    <title>Frontend Mentor | Intro component with sign up form</title>

    <style>
      .attribution {
        font-size: 11px;
        text-align: center;
      }
      .attribution a {
        color: hsl(228, 45%, 44%);
      }
    </style>
  </head>
  <body>
    <main>
      <section id="content">
        <h1>Learn to code by watching others </h1>
        
        <p>
          See how experienced developers solve
          problems in real-time. Watching scripted tutorials is great, but
          understanding how developers think is invaluable. 
        </p>
      </section>
      
      <div id="form">
        <a id="try-free" href=""><strong>Try it free 7 days</strong> <span>then  $20/mo. thereafter</span></a>

        <form action="#">
          <div id="inputs">
            <input type="text" name="first-name" id="ifirst-name" placeholder="First Name">
            <input type="text" name="last-name" id="ilast-name" placeholder="Last Name">
            <input type="email" name="email" id="iemail" placeholder="Email Address">
            <input type="password" name="password" id="ipassword" placeholder="Password">
          </div>

          <input type="submit" value="Claim your free trial" id="claim-free-trial">

          <p id="terms"> By clicking the button, you are agreeing to our <a href="#">
            <strong>Terms and Services</strong></a></p>
        </form>
      </div>
    </main>

    <!-- <footer>
      <p class="attribution">
        Challenge by
        <a
          href="https://www.frontendmentor.io?ref=challenge"
          target="_blank"
          rel="noopener noreferrer">Frontend Mentor</a
        >. Coded by <a href="#">Mateus Santos</a>.
      </p> -->
    </footer>
  </body>
</html>
