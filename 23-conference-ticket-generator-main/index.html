<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./assets/images/favicon-32x32.png"
    />
    <link rel="stylesheet" href="styles/style.css" />
    <link rel="stylesheet" href="styles/media-queries.css">
    <title>Frontend Mentor | Conference ticket generator</title>
    <style>
      .attribution {
        font-size: 11px;
        text-align: center;
      }
      .attribution a {
        color: hsl(228, 45%, 44%);
      }
    </style>
  </head>
  <body>
    <main>
      <section id="container-form">
        <div id="logo-form">
          <img src="assets/images/logo-full.svg" alt="logo-full" />
        </div>
        <h1>
          Your Journey to Coding Conf<br />
          2025 Starts Here!
        </h1>
        <p>Secure your spot at next year's biggest coding conference.</p>
        <form action="ticket-page.html" method="get">
          <div id="container-fl">
            <label for="iAvatar" id="label-upload">Upload Avatar</label>
            <div id="container-input-file">
              <img
                id="icon-upload"
                src="assets/images/icon-upload.svg"
                alt="icon-upload"
              />
              <input type="file" name="iAvatar" id="iAvatar" placeholder="." />
              <span id="file-placeholder"
                >Drag and drop or click to upload</span
              >
            </div>

            <div id="file-information">
              <i class="fa-solid fa-circle-info"></i>
              <p id="message-info" class="alertMessage">
                Upload your photo (JPG or PNG, max size: 500KB).
              </p>
            </div>
          </div>
          <div>
            <label for="iFullName">Full Name</label>
            <input type="text" name="iFullName" id="iFullName" required />
          </div>
          <div>
            <label for="iEmail">Email Address</label>
            <input
              type="email"
              name="iEmail"
              id="iEmail"
              placeholder="example@email.com"
            />
            <p id="errorEmail" class="alertMessage" hidden>
              Please enter a valid email address
            </p>
          </div>
          <div>
            <label for="iGitHubUser">GitHub Username</label>
            <input
              type="text"
              name="iGitHubUser"
              id="iGitHubUser"
              placeholder="@yourusername"
              required
            />
          </div>
          <input type="submit" value="Generate My Ticket" />
        </form>
      </section>
    </main>

    <!-- <div class="attribution">
    Challenge by <a href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a>. 
    Coded by <a href="#">Your Name Here</a>.
  </div> -->

    <script src="js/script.js"></script>
    <script
      src="https://kit.fontawesome.com/0a1412cd70.js"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
