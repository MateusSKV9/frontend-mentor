<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ticket</title>
  <link rel="stylesheet" href="styles/style.css">
  <link rel="stylesheet" href="styles/style-ticket.css">
  <link rel="stylesheet" href="styles/media-queries-ticket.css">
</head>
<body>
  <main>
    <section id="container-ticket">
      <div id="logo-ticket">
        <img src="assets/images/logo-full.svg" alt="logo-full" />
      </div>
      <section id="ticket-content">
        <h1 id="ticket-name">
          Congrats, ! Your ticket is ready.
        </h1>
        <p id="ticket-email">
          We've emailed your ticket to
          and will send updates in the run up to the event.
        </p>
    
        <div id="ticket">
          <img id="ticket-logo" src="assets/images/logo-full.svg" alt="logo-full">
          <img id="ticket-image" src="assets/images/pattern-ticket.svg" alt="pattern-ticket">
          <p id="ticket-date">Jan 31, 2025 / Austin, TX</p>
          
          <div id="container-information-ticket">
            <img id="image-profile" class="preview" src="assets/images/image-avatar.jpg" alt="image-avatar">

            <div id="container-github">
              <h4 id="name-profile"></h4>
              <div id="github-profile">
                <img src="assets/images/icon-github.svg" alt="icon-github">
                <p id="user-github"></p>
              </div>
            </div>
          </div>

          <p id="ticket-number"></p>
        </div>
      </section>
  </main>

  <footer>
    <p>
      Challenge by
      <a href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a
      >.
    </p>
    <p>Coded by <a href="#">Mateus Santos</a>.</p>
  </footer>

  <script src="js/script-ticket.js"></script>
  <script src="https://kit.fontawesome.com/0a1412cd70.js" crossorigin="anonymous"></script>
</body>
</html>
