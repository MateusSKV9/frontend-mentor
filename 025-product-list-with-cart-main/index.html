<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./assets/images/favicon-32x32.png"
    />
    <title>Frontend Mentor | Product list with cart</title>
    <link rel="stylesheet" href="styles/style.css" />
    <link rel="stylesheet" href="styles/media-queries.css" />
    <!-- <style>
    .attribution { font-size: 11px; text-align: center; }
    .attribution a { color: hsl(228, 45%, 44%); }
  </style> -->
  </head>
  <body>
    <main>
      <section id="container-desserts">
        <h2>Desserts</h2>

        <div id="desserts"></div>
      </section>

      <!------------------------ CART ------------------------>

      <section id="container-your-cart">
        <h3>Your Cart (<span id="qtd-total-dessert">0</span>)</h3>
        <div id="image-empety-cart">
          <img src="assets/images/illustration-empty-cart.svg" alt="" />
        </div>
        <p id="message-empety-cart">Your added items will appear here</p>

        <div id="container-list-order"></div>

        <div class="style-total" id="total-order">
          <p>Order total</p>
          <span id="total">$0.0</span>
        </div>

        <div id="container-carbono">
          <img src="assets/images/icon-carbon-neutral.svg" alt="" />
          <p>This is a Carbon-neutral delivery</p>
        </div>

        <button id="confirm-order" type="button">Confirm Order</button>
      </section>

      <dialog id="modal">
        <div class="image-confirm-order">
          <img src="assets/images/icon-order-confirmed.svg" alt="" />
        </div>
        <h2>Order Confirmed</h2>
        <p>We hope you your food</p>

        <div id="container-orders">
          <div class="style-total" id="total-order-confirm">
            <p>Order total</p>
            <span id="total-confirm">$0.0</span>
          </div>
        </div>

        <button id="start-new-order" type="button">Start New Order</button>
      </dialog>
    </main>

    <footer class="attribution">
    <p>Challenge by <a href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a>.</p> 
    <p>Coded by <a href="#">Your Name Here</a>.</p>
  </footer>

    <script
      src="https://kit.fontawesome.com/0a1412cd70.js"
      crossorigin="anonymous"
    ></script>
    <script src="js/script.js"></script>
  </body>
</html>
