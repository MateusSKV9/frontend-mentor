<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./images/favicon-32x32.png"
    />
    <link rel="stylesheet" href="styles/style.css" />
    <link rel="stylesheet" href="styles/media-queries.css" />
    <title>
      Frontend Mentor | Huddle landing page with single introductory section
    </title>
  </head>
  <body>
    <main>
      <div id="logo">
        <a href="#"><img src="images/logo.svg" alt="logo" /></a>
      </div>

      <div id="container-content">
        <div id="image">
          <img
            src="images/illustration-mockups.svg"
            alt="illustration-mockups"
          />
        </div>

        <section id="content">
          <h1>Build The Community Your Fans Will Love</h1>
          <p>
            Huddle re-imagines the way we build communities. You have a voice,
            but so does your audience. Create connections with your users as you
            engage in genuine discussion.
          </p>
          <a id="btnRegister" href="#">Register</a>
        </section>
      </div>

      <div id="container-social">
        <a href="" title="icon">
          <span class="box-icon"><i class="fa-brands fa-facebook-f"></i></span>
        </a>
        <a href="" title="icon">
          <span class="box-icon"><i class="fa-brands fa-twitter"></i></span>
        </a>
        <a href="" title="icon">
          <span class="box-icon"><i class="fa-brands fa-instagram"></i></span>
        </a>
      </div>
    </main>

    <footer>
      <p>
        Challenge by
        <a
          href="https://www.frontendmentor.io?ref=challenge"
          target="_blank"
          rel="noopener noreferrer"
          >Frontend Mentor</a
        >.
      </p>
      <p>Coded by <a href="#">Mateus Santos</a>.</p>
    </footer>

    <script
      src="https://kit.fontawesome.com/0a1412cd70.js"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
