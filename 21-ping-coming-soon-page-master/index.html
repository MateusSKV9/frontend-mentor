<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./images/favicon-32x32.png"
    />
    <title>Frontend Mentor | Ping coming soon page</title>
    <link rel="stylesheet" href="styles/style.css" />
    <link rel="stylesheet" href="styles/media-queries.css" />
  </head>
  <body>
    <main>
      <div id="image-logo">
        <img src="images/logo.svg" alt="logo" />
      </div>

      <h1>We are launching <span>soon!</span></h1>
      <h5>Subscribe and get notified</h5>

      <div id="container-search">
        <form action="" novalidate>
          <div id="container-input-email">
            <input
              type="email"
              name="email"
              id="iemail"
              aria-label="email"
              placeholder="Your email address..."
              required
            />
            <p id="error-message" hidden>
              Please provide a valid email address
            </p>
          </div>
          <input id="btnNotify" type="submit" value="Notify Me" />
        </form>
      </div>

      <div id="image-dashboard">
        <img
          src="images/illustration-dashboard.png"
          alt="illustration-dashboard"
        />
      </div>

      <div id="more-informations">
        <div id="container-social">
          <div class="box-icon"><i class="fa-brands fa-facebook-f"></i></div>
          <div class="box-icon"><i class="fa-brands fa-twitter"></i></div>
          <div class="box-icon"><i class="fa-brands fa-instagram"></i></div>
        </div>
        <p>&copy; Copyright Ping. All rights reserved.</p>
      </div>
    </main>

    <footer>
      <p>
        Challenge by
        <a
          href="https://www.frontendmentor.io?ref=challenge"
          rel="noopener noferrer"
          target="_blank"
          >Frontend Mentor</a
        >.
      </p>
      <p>Coded by <a href="#">Mateus Santos</a>.</p>
    </footer>

    <script
      src="https://kit.fontawesome.com/0a1412cd70.js"
      crossorigin="anonymous"
    ></script>
    <script src="js/script.js"></script>
  </body>
</html>
