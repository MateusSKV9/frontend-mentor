<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png" />
		<link rel="stylesheet" href="styles/style.css" />
		<link rel="stylesheet" href="styles/media-queries.css" />
		<title>Frontend Mentor | Fylo data storage component</title>
	</head>
	<body>
		<main>
			<div id="primary-container">
				<img id="logo" src="images/logo.svg" alt="Logo" />

				<div id="container-box-image">
					<div class="box-image"><img src="images/icon-document.svg" alt="Ícone de documento" /></div>

					<div class="box-image"><img src="images/icon-folder.svg" alt="Ícone de pasta" /></div>

					<div class="box-image"><img src="images/icon-upload.svg" alt="Ícone de upload" /></div>
				</div>
			</div>

			<div id="secondary-container">
				<p>You’ve used <strong>815 GB</strong> of your storage</p>

				<div id="container-progress">
					<progress value="80" min="0" max="100"></progress>
					<div class="flex-between">
						<span>0 GB</span>
						<span>1000 GB</span>
					</div>
				</div>

				<div id="pop-up"><strong>185</strong> GB Left</div>
			</div>
		</main>

		<footer class="attribution">
			<p>
				Challenge by
				<a href="https://www.frontendmentor.io?ref=challenge" rel="noopener noreferrer" target="_blank"
					>Frontend Mentor</a
				>.
			</p>

			<p>Coded by <a href="#">Mateus Santos</a>.</p>
		</footer>
	</body>
</html>
